<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ATEEZ YouTube 콘텐츠 아카이브"
    >

    <title>YouTube | Ateez Archive</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../../css/category-page.css"
    >
</head>

<body
    data-root-path="../../"
    data-category-page="youtube"
>
    <header class="site-header">
        <button
            id="menuButton"
            class="icon-button"
            type="button"
            aria-label="카테고리 메뉴 열기"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            ☰
        </button>

        <a
            class="site-title"
            href="../../index.html"
        >
            Ateez Archive
        </a>

        <button
            id="searchButton"
            class="icon-button"
            type="button"
            aria-label="검색 열기"
        >
            🔍
        </button>
    </header>


    <div id="sidebarComponent"></div>

    <button
        id="pageOverlay"
        class="page-overlay"
        type="button"
        aria-label="카테고리 메뉴 닫기"
        tabindex="-1"
    ></button>


    <section class="category-page-banner">
        <div class="category-page-banner-content">
            <p class="banner-label">
                ATEEZ ARCHIVE
            </p>

            <h1>
                YouTube
            </h1>

            <p>
                ATEEZ의 YouTube 콘텐츠를 카테고리별로 확인하세요.
            </p>
        </div>
    </section>


    <main class="main-content category-page-content">
        <section
            class="content-section"
            aria-labelledby="youtubeContentTitle"
        >
            <div class="section-heading category-page-heading">
                <div>
                    <p class="section-label">
                        YOUTUBE
                    </p>

                    <h2 id="youtubeContentTitle">
                        콘텐츠 선택
                    </h2>
                </div>

                <p
                    id="categoryResultCount"
                    class="filter-result-count"
                    data-filter-result-count
                    aria-live="polite"
                >
                    전체 0개
                </p>
            </div>


            <div
                class="category-search"
                role="search"
            >
                <label
                    class="visually-hidden"
                    for="categorySearchInput"
                >
                    YouTube 콘텐츠 검색
                </label>

                <input
                    id="categorySearchInput"
                    class="category-search-input"
                    type="search"
                    placeholder="제목, 태그, 멤버 이름으로 검색"
                    autocomplete="off"
                >

                <button
                    id="categorySearchReset"
                    class="category-search-reset"
                    type="button"
                >
                    초기화
                </button>
            </div>


            <div
                id="categoryFilter"
                class="category-filter"
                role="group"
                aria-label="YouTube 콘텐츠 중분류 선택"
            ></div>


            <div
                id="detailCategoryFilter"
                class="detail-category-filter"
                role="group"
                aria-label="YouTube 콘텐츠 소분류 선택"
            ></div>


            <div
                id="categoryContentGrid"
                class="content-grid category-content-grid"
                aria-live="polite"
            ></div>

            <p
                id="categoryEmptyMessage"
                class="category-empty-message"
                hidden
            >
                검색 조건에 맞는 콘텐츠가 없습니다.
            </p>
        </section>
    </main>


    <script src="../../js/script.js"></script>
    <script src="../../js/member-data.js"></script>
    <script src="../../js/data/youtube.js"></script>
    <script src="../../js/category-page.js"></script>
</body>
</html>
