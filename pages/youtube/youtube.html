<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ATEEZ YouTube 콘텐츠 아카이브"
    >

    <title>YouTube | Ateez Archive</title>

    <link
        rel="stylesheet"
        href="../..css/style.css"
    >
</head>

<body data-root-path="../../">
    <!-- 상단 헤더 -->
    <header class="site-header">
        <button
            id="menuButton"
            class="icon-button"
            type="button"
            aria-label="카테고리 메뉴 열기"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            ☰
        </button>

        <a
            class="site-title"
            href="../../index.html"
        >
            Ateez Archive
        </a>

        <button
            id="searchButton"
            class="icon-button"
            type="button"
            aria-label="검색 열기"
        >
            🔍
        </button>
    </header>


    <!-- sidebar.html이 삽입되는 위치 -->
    <div id="sidebarComponent"></div>


    <!-- 사이드바가 열렸을 때 배경을 어둡게 처리 -->
    <button
        id="pageOverlay"
        class="page-overlay"
        type="button"
        aria-label="카테고리 메뉴 닫기"
        tabindex="-1"
    ></button>


    <!-- YouTube 페이지 배너 -->
    <section class="main-banner">
        <div class="banner-content">
            <p class="banner-label">
                ATEEZ ARCHIVE
            </p>

            <h1>
                YouTube
            </h1>

            <p>
                Original Content &amp; External Content
            </p>
        </div>
    </section>


    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section
            class="category-section"
            aria-labelledby="youtubeCategoryTitle"
        >
            <div class="section-heading">
                <div>
                    <p class="section-label">
                        YOUTUBE
                    </p>

                    <h2 id="youtubeCategoryTitle">
                        카테고리
                    </h2>
                </div>
            </div>


            <!-- YouTube 중분류 카드 -->
            <div class="category-grid">
                <!-- Original Content -->
                <a
                    class="category-card"
                    href="original-content/index.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        ❤️
                    </span>

                    <strong>
                        Original Content
                    </strong>
                </a>


                <!-- External Content -->
                <a
                    class="category-card"
                    href="external-content/index.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        ❤️
                    </span>

                    <strong>
                        External Content
                    </strong>
                </a>


                <!-- All -->
                <a
                    class="category-card"
                    href="all.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        ❤️
                    </span>

                    <strong>
                        All
                    </strong>
                </a>
            </div>
        </section>
    </main>


    <script src="../../js/script.js"></script>
</body>
</html>
