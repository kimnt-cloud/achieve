<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ATEEZ 기념일 콘텐츠 아카이브"
    >

    <title>Anniversary | Ateez Archive</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../../css/category-hub.css"
    >
</head>

<body data-root-path="../../">
    <!-- 상단 헤더 -->
    <header class="site-header">
        <button
            id="menuButton"
            class="icon-button"
            type="button"
            aria-label="카테고리 메뉴 열기"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            ☰
        </button>

        <a
            class="site-title"
            href="../../index.html"
        >
            Ateez Archive
        </a>

        <button
            id="searchButton"
            class="icon-button"
            type="button"
            aria-label="검색 열기"
        >
            🔍
        </button>
    </header>


    <!-- sidebar.html이 삽입되는 위치 -->
    <div id="sidebarComponent"></div>


    <!-- 사이드바 뒤의 어두운 배경 -->
    <button
        id="pageOverlay"
        class="page-overlay"
        type="button"
        aria-label="카테고리 메뉴 닫기"
        tabindex="-1"
    ></button>


    <!-- Anniversary 배너 -->
    <section class="main-banner">
        <div class="banner-content">
            <p class="banner-label">
                ATEEZ ARCHIVE
            </p>

            <h1>
                Anniversary
            </h1>

            <p>
                Debut & Anniversary Content
            </p>
        </div>
    </section>


    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section
            class="category-section"
            aria-labelledby="anniversaryCategoryTitle"
        >
            <div class="section-heading">
                <div>
                    <p class="section-label">
                        ANNIVERSARY
                    </p>

                    <h2 id="anniversaryCategoryTitle">
                        카테고리
                    </h2>
                </div>
            </div>


            <div class="category-grid">
                <a
                    class="category-card"
                    href="debut/debut.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🩶
                    </span>

                    <strong>
                        Debut
                    </strong>
                </a>


                <a
                    class="category-card"
                    href="1st-anniversary/1st-anniversary.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🩶
                    </span>

                    <strong>
                        1st Anniversary
                    </strong>
                </a>


                <a
                    class="category-card"
                    href="2nd-anniversary/2nd-anniversary.html"

                        class="category-icon"
                        aria-hidden="true"

                        🩶
                    </span>

                    <strong>
                        2nd Anniversary
                    </strong>
                </a>


                <a
                    class="category-card"
                    href="3rd-anniversary/3rd-anniversary.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🩶
                    </span>

                    <strong>
                        3rd Anniversary
                    </strong>
                </a>


                <a
                    class="category-card"
                    href="4th-anniversary/4th-anniversary.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🩶
                    </span>

                    <strong>
                        4th Anniversary
                    </strong>
                </a>


                <a
                    class="category-card"
                    href="5th-anniversary/5th-anniversary.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🩶
                    </span>

                    <strong>
                        5th Anniversary
                    </strong>
                </a>


                <a
                    class="category-card"

                </a>


                <a
