<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="ATEEZ 앨범 콘텐츠 아카이브"
    >

    <title>Album | Ateez Archive</title>

    <link
        rel="stylesheet"
        href="../../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../../css/category-hub.css"
    >
</head>

<body data-root-path="../../">
    <!-- 상단 헤더 -->
    <header class="site-header">
        <button
            id="menuButton"
            class="icon-button"
            type="button"
            aria-label="카테고리 메뉴 열기"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            ☰
        </button>

        <a
            class="site-title"
            href="../../index.html"
        >
            Ateez Archive
        </a>

        <button
            id="searchButton"
            class="icon-button"
            type="button"
            aria-label="검색 열기"
        >
            🔍
        </button>
    </header>


    <!-- sidebar.html이 삽입되는 위치 -->
    <div id="sidebarComponent"></div>


    <!-- 사이드바 뒤의 어두운 배경 -->
    <button
        id="pageOverlay"
        class="page-overlay"
        type="button"
        aria-label="카테고리 메뉴 닫기"
        tabindex="-1"
    ></button>


    <!-- Album 배너 -->
    <section class="main-banner">
        <div class="banner-content">
            <p class="banner-label">
                ATEEZ ARCHIVE
            </p>

            <h1>
                Album
            </h1>

            <p>
                Korea, Single, Japan &amp; Solo
            </p>
        </div>
    </section>


    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section
            class="category-section"
            aria-labelledby="albumCategoryTitle"
        >
            <div class="section-heading">
                <div>
                    <p class="section-label">
                        ALBUM
                    </p>

                    <h2 id="albumCategoryTitle">
                        카테고리
                    </h2>
                </div>
            </div>


            <div class="category-grid">
                <!-- Korea -->
                <a
                    class="category-card"
                    href="korea/korea.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🖤
                    </span>

                    <strong>
                        Korea
                    </strong>
                </a>


                <!-- Single -->
                <a
                    class="category-card"
                    href="single/single.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🖤
                    </span>

                    <strong>
                        Single
                    </strong>
                </a>


                <!-- Japan -->
                <a
                    class="category-card"
                    href="japan/japan.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🖤
                    </span>

                    <strong>
                        Japan
                    </strong>
                </a>


                <!-- Solo -->
                <a
                    class="category-card"
                    href="solo/solo.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🖤
                    </span>

                    <strong>
                        Solo
                    </strong>
                </a>


                <!-- All -->
                <a
                    class="category-card"
                    href="../../pages/album/all.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🖤
                    </span>

                    <strong>
                        All
                    </strong>
                </a>
            </div>
        </section>
    </main>


    <script src="../../js/script.js"></script>
</body>
</html>
