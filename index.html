<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 한글과 특수문자가 깨지지 않도록 UTF-8 문자 인코딩을 사용합니다. -->
    <meta charset="UTF-8">

    <!-- 모바일 화면에서 실제 기기 너비에 맞춰 페이지가 표시되도록 설정합니다. -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- 검색 결과와 공유 정보에 사용될 수 있는 페이지 설명입니다. -->
    <meta
        name="description"
        content="ATEEZ Archive"
    >

    <!-- 브라우저 탭에 표시되는 페이지 제목입니다. -->
    <title>Ateez Archive</title>

    <!-- 메인 스타일시트를 불러와 페이지 전체 디자인을 적용합니다. -->
    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<!--
    실제 화면에 표시되는 모든 콘텐츠가 들어가는 영역입니다.

    data-page-depth는 기존 구조에서 사용하던 페이지 깊이 정보입니다.
    현재 script.js는 data-root-path를 사용하므로,
    경로 시스템을 통일할 때는 data-root-path=""로 변경할 수 있습니다.
-->
<body data-page-depth="">
    <!--
        상단 헤더
        메뉴 열기 버튼, 사이트 제목, 검색 버튼을 한 줄에 배치합니다.
    -->
    <header class="site-header">
        <button
            id="menuButton"
            class="icon-button"
            type="button"
            aria-label="카테고리 메뉴 열기"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            ☰
        </button>

        <a
            class="site-title"
            href="index.html"
        >
            Ateez Archive
        </a>

        <button
            id="searchButton"
            class="icon-button"
            type="button"
            aria-label="검색 열기"
        >
            🔍
        </button>
    </header>


    <!--
        sidebar.html이 삽입되는 위치입니다.

        script.js에서 sidebar.html을 불러온 뒤
        이 요소 내부에 사이드바를 삽입합니다.
    -->
    <!--
        sidebar.html의 내용을 JavaScript가 이 요소 안에 삽입합니다.
        여러 페이지에서 동일한 사이드바 파일을 공유하기 위한 자리입니다.
    -->
    <div id="sidebarComponent"></div>

    <!--
        사이드바가 열렸을 때 본문 뒤를 어둡게 덮는 오버레이입니다.
        오버레이를 누르면 사이드바가 닫힙니다.
    -->
    <button
    id="pageOverlay"
    class="page-overlay"
    type="button"
    aria-label="카테고리 메뉴 닫기"
    tabindex="-1"
    ></button>


    <!--
        메인 배너
        사이트의 핵심 제목과 간단한 소개 문구를 크게 보여줍니다.
    -->
    <section class="main-banner">
        <div class="banner-content">
            <p class="banner-label">
                All about ATEEZ
            </p>

            <h1>
                ATEEZ ARCHIVE
            </h1>

            <p>
                @kimnt.private
            </p>
        </div>
    </section>


    <!--
        메인 콘텐츠
        각 대분류 페이지로 이동하는 카테고리 카드를 표시합니다.
    -->
    <main class="main-content">
        <section
            class="category-section"
            aria-labelledby="mainCategoryTitle"
        >
            <div class="section-heading">
                <div>
                    <!-- <p class="section-label">
                        CATEGORY
                    </p> -->

                    <!-- <h2 id="mainCategoryTitle">
                        카테고리
                    </h2> -->
                </div>
            </div>


            <!--
                카테고리 카드 그리드
                화면 크기에 따라 여러 열로 배치되며,
                각 카드는 해당 대분류 페이지로 이동합니다.
            -->


            <div class="category-grid">
                <!-- YouTube 대분류 페이지로 이동하는 카드입니다. -->
                <a
                    class="category-card"
                    href="pages/youtube/youtube.html"
                >

                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        ❤️
                    </span>

                    <strong>
                        YouTube
                    </strong>
                </a>


                <!-- Radio 대분류 페이지로 이동하는 카드입니다. -->
                <a
                    class="category-card"
                    href="pages/radio/radio.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🧡
                    </span>

                    <strong>
                        Radio
                    </strong>
                </a>


                <!-- Show 대분류 페이지로 이동하는 카드입니다. -->
                <a
                    class="category-card"
                    href="pages/show/show.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        💛
                    </span>

                    <strong>
                        Show
                    </strong>
                </a>


                <!-- Universe 대분류 페이지로 이동하는 카드입니다. -->
                <a
                    class="category-card"
                    href="pages/universe/universe.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        💚
                    </span>

                    <strong>
                        Universe
                    </strong>
                </a>


                <!-- Performance 대분류 페이지로 이동하는 카드입니다. -->
                <a
                    class="category-card"
                    href="pages/performance/performance.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        💙
                    </span>

                    <strong>
                        Performance
                    </strong>
                </a>


                <!-- Live 대분류 페이지로 이동하는 카드입니다. -->
                <a
                    class="category-card"
                    href="pages/live/live.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        💜
                    </span>

                    <strong>
                        Live
                    </strong>
                </a>

                <div class="category-grid">
                <!-- anniversary 대분류 페이지로 이동하는 카드입니다. -->
                <a
                    class="category-card"
                    href="pages/anniversary/anniversary.html"
                >

                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🩶
                    </span>

                    <strong>
                        Anniversary
                    </strong>
                </a>

                <!-- Album 대분류 페이지로 이동하는 카드입니다. -->
                <a
                    class="category-card"
                    href="pages/album/album.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🖤
                    </span>

                    <strong>
                        Album
                    </strong>
                </a>
            </div>
        </section>
    </main>

    <!--
        공통 사이드바 로딩, 메뉴 열기·닫기, 현재 페이지 표시 등
        페이지 동작을 담당하는 JavaScript 파일을 불러옵니다.
    -->
    <script src="js/script.js"></script>
</body>
</html>
