<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="All about ATEEZ"
    >

    <title>Ateez Archive</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body data-page-depth="">
    <!-- 상단 헤더 -->
    <header class="site-header">
        <button
            id="menuButton"
            class="icon-button"
            type="button"
            aria-label="카테고리 메뉴 열기"
            aria-controls="sidebar"
            aria-expanded="false"
        >
            ☰
        </button>

        <a
            class="site-title"
            href="index.html"
        >
            Ateez Archive
        </a>

        <button
            id="searchButton"
            class="icon-button"
            type="button"
            aria-label="검색 열기"
        >
            🔍
        </button>
    </header>


    <!--
        sidebar.html이 삽입되는 위치입니다.

        script.js에서 sidebar.html을 불러온 뒤
        이 요소 내부에 사이드바를 삽입합니다.
    -->
    <div id="sidebarComponent"></div>

    <button
    id="pageOverlay"
    class="page-overlay"
    type="button"
    aria-label="카테고리 메뉴 닫기"
    tabindex="-1"
    ></button>


    <!-- 메인 배너 -->
    <section class="main-banner">
        <div class="banner-content">
            <p class="banner-label">
                All about ATEEZ
            </p>

            <h1>
                ATEEZ ARCHIVE
            </h1>

            <p>
                @kimnt.private
            </p>
        </div>
    </section>


    <!-- 메인 콘텐츠 -->
    <main class="main-content">
        <section
            class="category-section"
            aria-labelledby="mainCategoryTitle"
        >
            <div class="section-heading">
                <div>
                    <!-- <p class="section-label">
                        CATEGORY
                    </p> -->

                    <!-- <h2 id="mainCategoryTitle">
                        카테고리
                    </h2> -->
                </div>
            </div>


            <div class="category-grid">
                <a
                    class="category-card"
                    href="pages/youtube/youtube.html"
                >

                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        ❤️
                    </span>

                    <strong>
                        YouTube
                    </strong>
                </a>


                <a
                    class="category-card"
                    href="pages/radio/radio.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🧡
                    </span>

                    <strong>
                        Radio
                    </strong>
                </a>


                <!-- Show -->
                <a
                    class="category-card"
                    href="pages/show/show.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        💛
                    </span>

                    <strong>
                        Show
                    </strong>
                </a>


                <!-- Universe -->
                <a
                    class="category-card"
                    href="pages/universe/universe.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        💚
                    </span>

                    <strong>
                        Universe
                    </strong>
                </a>


                <!-- Performance -->
                <a
                    class="category-card"
                    href="pages/performance/performance.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        💙
                    </span>

                    <strong>
                        Performance
                    </strong>
                </a>


                <!-- Live -->
                <a
                    class="category-card"
                    href="pages/live/live.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        💜
                    </span>

                    <strong>
                        Live
                    </strong>
                </a>


                <!-- Album -->
                <a
                    class="category-card"
                    href="pages/album/album.html"
                >
                    <span
                        class="category-icon"
                        aria-hidden="true"
                    >
                        🖤
                    </span>

                    <strong>
                        Album
                    </strong>
                </a>
            </div>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
